name: Build & verify

# 说明：本站 GitHub Pages 使用 legacy 模式（设置 → Pages → Deploy from a branch
# → main /docs），推送后由 GitHub 自带的 "pages build and deployment" 自动发布，
# 因此本工作流不再执行部署动作，只做构建校验，保证 docs/ 始终可正确生成。
#
# 若将来要改用 Actions 部署：需先在仓库 Settings → Pages → Source 切到
# "GitHub Actions"，再恢复 upload-pages-artifact / deploy-pages 两个步骤。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Build site
        run: |
          python build.py

      - name: Verify output
        run: |
          test -f docs/index.html
          test -f docs/sitemap.xml
          test -f docs/rss.xml
          test -f docs/CNAME
          test -f docs/latest/index.html
          test -f docs/latest/index.json
          test -f docs/news/index.html
          echo "构建产物校验通过"
