# 数据源配置中心 - Stock Analysis 项目
# 用于规范所有分析报告的数据来源和验证方式

# ==========================================
# 1. 财务数据源（官方公告）
# ==========================================
financial_sources:
  沪深 A 股:
    官方公告:
      平台：https://www.cninfo.com.cn (巨潮资讯)
      使用：公司公告、定期报告、业绩预告
      优先级：⭐⭐⭐⭐⭐
    
    实时行情:
      平台：https://push2.eastmoney.com/api/qt/stock/list
      使用：股价、市值、PE 等实时数据
      优先级：⭐⭐⭐⭐⭐
    
    财务指标:
      平台：https://emweb.securities.eastmoney.com/pc_hsf10/pages/index.html
      使用：营收、净利润、毛利率等
      优先级：⭐⭐⭐⭐

  财报提取器:
    API: https://apppush.csjson.com/api/stockinfo/json.aspx
    用途：自动化获取财报数据
    优先级：⭐⭐⭐⭐

# ==========================================
# 2. 行业数据来源
# ==========================================
industry_sources:
  PCB:
    Prismark:
      官网：https://www.prismark.com/press-releases
      数据：全球 PCB 产值预测、层数分类增速
      更新频率：年度
      优先级：⭐⭐⭐⭐⭐
    
    中国电子电路协会:
      官网：https://cPCA.org.cn/
      数据：国内 PCB 行业数据
      优先级：⭐⭐⭐⭐

  半导体/AI:
    IDC:
      官网：https://www.idc.com
      数据：服务器出货量、AI 芯片市场
      优先级：⭐⭐⭐⭐⭐
    
    Gartner:
      官网：https://www.gartner.com
      数据：行业趋势预测
      优先级：⭐⭐⭐⭐

# ==========================================
# 3. 券商研报来源
# ==========================================
brokerage_sources:
  主流券商:
    - 中信证券
    - 中金公司
    - 华泰证券
    - 天风证券
    - 浙商证券
    - 华创证券
    - 招商证券
    
  研报聚合平台:
    Wind: https://www.wind.com.cn (付费)
    Choice: https://www.choicewind.com (付费)
    慧博投研：https://www.hibor.com.cn (部分免费)
    萝卜投研：https://www.roboat.cn (部分免费)
    
  验证要求:
    最少数量：3 家独立券商
    一致性检查：预测差异超过 20% 需说明原因
    
# ==========================================
# 4. 行情数据验证
# ==========================================
market_data_validation:
  数据来源:
    - 东方财富（优先）
    - 同花顺
    - 雪球
    
  验证要求:
    - 必须标注"最后更新时间"
    - 收盘价误差 < 0.5%
    - 如有停牌需说明
    
  更新频率:
    交易日：15:30 前
    非交易日：前一交易日收盘价

# ==========================================
# 5. 数据可靠性评分规则
# ==========================================
confidence_scores:
  官方公告：5.0 分
  交易所官网: 5.0 分
  权威机构 (Prismark/IDC): 4.5 分
  主流券商研报：4.0 分
  财务数据聚合平台：4.0 分
  其他第三方：3.0 分
  
  最低要求：3.5 分
  
  计算方式：
    - 每条数据独立评分
    - 综合分数 = 平均值
    - 关键数据（营收、净利润）必须 ≥4.0

# ==========================================
# 6. 数据验证流程
# ==========================================
verification_workflow:
  1. 数据收集:
     - 优先官方来源（巨潮资讯）
     - 多个独立源交叉验证
  
  2. 数据检查:
     - 数值合理性检验
     - 同比/环比异常检查
     - 行业趋势一致性
  
  3. 源链接验证:
     - 所有官方链接必须可访问
     - 标注精确的发布日期
  
  4. 最终审核:
     - 检查验证清单（见 agents.md 第 6 节）
     - 综合评分 ≥3.5 分
  
  5. 文档记录:
     - metadata.yaml 中声明所有数据源
     - 生成验证报告嵌入页面
