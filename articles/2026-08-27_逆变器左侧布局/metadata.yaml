summary: "2026 H1 11 家上市逆变器企业合计营收 727.64 亿（+6.77%）、合计归母净利 109.07 亿（-4.48%）；阳光 + 德业 + 思格 三家拿走 95.57% 的净利润。三大主线：1）国内集中式洗牌中段、阳光 Q2 环比 +29.5%；2）出口'量减价增'——量 -6.5%、额 +30%、单台均价 +39%；3）储能 + AIDC 接棒——阳光储能营收已超逆变器，AIDC 配储在手 2GWh + 跟进 10+GWh。Q3 拐点看三个数：阳光储能出货、行业合计净利同比、欧洲户储出口额。"
description: "基于 11 家 A 股上市逆变器与储能企业 2026 半年报数据，梳理行业洗牌格局、出口结构性机会、储能 + AIDC 新增长极，并给出 Q3 拐点验证的三个关键指标。比风电更值得左侧布局的逻辑：估值未充分修复 + 头部份额已集中 + 新增长极已成型。"
