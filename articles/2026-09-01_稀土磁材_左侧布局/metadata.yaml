summary: "本周稀土磁材板块反弹 1.38%、跑赢 1.59pct；行业 PE 53.06 倍（历史 45.3% 分位）。价格信号：中重稀土氧化镝 +2.47%、氧化铽 +1.42%，但钕铁硼毛坯 −0.4%~−0.5% 回调。供给端核心信号：分离企业停产未复产、金属厂普遍倒挂并减产，供给上限被锁。需求端短期偏淡但磁材大厂开工稳定，金九银十旺季订单有望释放。长期增量来自人形机器人电机转子。研报重点推荐金力永磁（300748），2026 H1 营收 46.49 亿 +32.57%、净利 4.62 亿 +51.58%，4 万吨产能已满产、2027 年底扩至 6 万吨。"
description: "基于 2026-09-01 中信证券稀土磁材研报，梳理板块反弹、估值分位、价格分化、供给收紧循环、旺季需求与长期机器人增量。Q4 验证盯氧化镝周价、金属厂开工率、磁材排产、毛坯价四个信号。左侧跟踪+右侧追涨组合，上游资源看回调、中游磁材等排产数据。"
published: true