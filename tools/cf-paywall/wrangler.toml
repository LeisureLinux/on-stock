name = "stock-paywall"
main = "worker.js"
compatibility_date = "2026-09-07"

# 绑定自定义域：部署后由 Cloudflare 自动写 DNS 记录
# 主域 stock.freelamp.com 由本 Worker 直接接管（无 301 跳转）
routes = [
  { pattern = "stock.freelamp.com", custom_domain = true },
]

# 账号库。创建后把 id 填到这里：
#   npx wrangler kv namespace create USERS
[[kv_namespaces]]
binding = "USERS"
id = "66b06a40ad1549ba97ebad1ecadf69a7"

[vars]
# 源站：GitHub Pages 绑定的自定义子域，不对外公开
ORIGIN_HOST = "origin-stock.freelamp.com"
# 订阅系统（非敏感部分；敏感 key 用 wrangler secret put）
RESEND_FROM = "subscribe@freelamp.com"
ADMIN_EMAIL = "albertxu@freelamp.com"
SITE_URL = "https://stock.freelamp.com"
TURNSTILE_SITE_KEY = "0x4AAAAAAE1Iy-NwXPvgymQ0"

# SESSION_SECRET / RESEND_API_KEY / TURNSTILE_SECRET 走 secret：
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put TURNSTILE_SECRET
